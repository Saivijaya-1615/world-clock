<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock - Vijaya</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select>
        <option value="">Select a city...</option>
        <option value="America/Los_Angeles">Los Angeles</option>
        <option value="Europe/London">London</option>
        <option value="Pacific/Auckland">Auckland</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Australia/Sydney">Sydney</option>
        <option value="America/Toronto">Canada</option>
      </select>

      <div class="city" id="la">
        <div>
          <h2>Los Angeles 🇺🇸</h2>
          <div class="date" id="la-date"></div>
        </div>
        <div class="time" id="la-time"></div>
      </div>

      <div class="city" id="paris">
        <div>
          <h2>Paris 🇫🇷</h2>
          <div class="date" id="paris-date"></div>
        </div>
        <div class="time" id="paris-time"></div>
      </div>
    </div>

    <footer>
      This project was coded with ❤️ by Vijaya and is
      <a href="https://github.com/Saivijaya-1615/world-clock" target="_blank">
        open sourced on GitHub
      </a>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
